<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Kanzlei probe</title>
<style>body{background:#14110c;color:#e3d9bd;font:14px Consolas,monospace;padding:20px}td{padding:3px 14px 3px 0}.y{color:#4caf76}.n{color:#e0614f}</style></head>
<body><h2>Kanzlei GM &ndash; browser probe</h2><p>Tell me what is shown here (screenshot is fine).</p><table id="t"></table>
<script>
var rows = [], ua = navigator.userAgent;
function add(n, v) { rows.push([n, v]); }
add('userAgent', ua);
function css(p, v) { try { return !!(window.CSS && CSS.supports ? CSS.supports(p, v) : false); } catch (e) { return false; } }
add('flexbox', css('display', 'flex'));
add('CSS grid', css('display', 'grid'));
add('CSS variables', css('--a', '0'));
add('XMLHttpRequest', typeof XMLHttpRequest !== 'undefined');
add('fetch', typeof fetch !== 'undefined');
add('Promise', typeof Promise !== 'undefined');
add('JSON', typeof JSON !== 'undefined');
add('localStorage (works)', (function () { try { localStorage.setItem('k', '1'); localStorage.removeItem('k'); return true; } catch (e) { return false; } })());
add('HTML5 drag and drop', 'draggable' in document.createElement('span'));
add('ES6 arrow functions', (function () { try { return eval('(()=>1)()') === 1; } catch (e) { return false; } })());
add('ES6 let / template strings', (function () { try { return eval('let a=1;`${a}`') === '1'; } catch (e) { return false; } })());
add('String.normalize', typeof ''.normalize === 'function');
add('window size', window.innerWidth + ' x ' + window.innerHeight);
add('devicePixelRatio', window.devicePixelRatio);
var imgUrl = (location.search.match(/[?&]img=([^&]*)/) || [])[1];
if (imgUrl) { imgUrl = decodeURIComponent(imgUrl); var im = new Image(); im.onload = function () { add('icon from the game folder (file://)', true); render(); }; im.onerror = function () { add('icon from the game folder (file://)', false); render(); }; im.src = imgUrl; add('icon test address', imgUrl); }
var t = document.getElementById('t');
function render() { t.innerHTML = ''; draw(); }
function draw() {
for (var i = 0; i < rows.length; i++) {
  var v = rows[i][1], c = v === true ? 'y' : v === false ? 'n' : '';
  t.innerHTML += '<tr><td>' + rows[i][0] + '</td><td class="' + c + '">' + String(v) + '</td></tr>';
}
}
draw();
</script></body></html>
