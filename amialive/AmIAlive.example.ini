# AmIAlive settings. Copy this file to AmIAlive.ini (next to AmIAlive.exe) and fill in what you need.
# AmIAlive.ini holds secrets (webhook, upload token): never put it into git or a zip you share.

# ---- what to watch -------------------------------------------------------------------------------
process=ddctd_cm_yo_server
bat=Start_LiF_Server_VPS.bat
grace=120                 # quiet seconds after a start (the bat starts MariaDB first)
interval=5                # how often the watchdog looks (seconds)
checkstarters=1           # 1 = never start while another starter (the bat, an old task, a person) is already starting the server
dryrun=0                  # 1 = only write what it would do into the log

# ---- crash loop / kill switch ----------------------------------------------------------------------
loopmax=5                 # this many crashes ...
loopminutes=10            # ... within this many minutes is a crash loop
onloop=hold               # hold = KILL SWITCH: the server is force closed and stays off until "AmIAlive.exe release"
                          # pause = no restarts for pauseminutes, then it tries again
pauseminutes=15
kill_db=0                 # 1 = the kill switch also ends MariaDB

# ---- Discord webhook (leave empty = no messages) ----------------------------------------------------
# Discord: channel settings > Integrations > Webhooks > New Webhook > Copy URL
discord=
discord_name=LiF Server
discord_mention=          # e.g. <@123456789012345678> (a user) or <@&123456789012345678> (a role); pinged on crash loop / kill switch only
warn_ram=93               # message when RAM stays above this percent for 3 minutes (0 = off)
warn_disk_gb=5            # message when less than this is free on the server drive (0 = off)

# ---- crash reports to the bucket (leave report_url empty = no upload) --------------------------------
# report_url is the address of the crash bucket worker (crash-bucket/README.md), e.g. https://crash.wulpischelande.de/upload
report_url=
report_token=             # the worker's UPLOAD_TOKEN (it can only add reports)
report_dirs=.;logs;data;log      # folders (relative to this folder) that hold the server logs
report_glob=*.log;*.dmp;*.err
report_days=3             # only files changed in the last N days
report_maxmb=25           # size of all files together (before zipping)
report_tailkb=4096        # of a bigger file only the last N KB are taken
report_minutes=10         # at most one automatic report per N minutes

# ---- screen ------------------------------------------------------------------------------------------
fancy=0                   # 1 = block characters in the graphs (needs a console font that has them, e.g. Consolas)
